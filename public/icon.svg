<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Partner 1 Dot (Indigo) -->
  <circle cx="180" cy="180" r="54" fill="#ffffff" fill-opacity="0.25" />
  <circle cx="180" cy="180" r="42" fill="#ffffff" />
  <text x="180" y="196" font-size="44" text-anchor="middle" font-family="system-ui, sans-serif">🦊</text>

  <!-- Partner 2 Dot (Pink) -->
  <circle cx="332" cy="180" r="54" fill="#ffffff" fill-opacity="0.25" />
  <circle cx="332" cy="180" r="42" fill="#ffffff" />
  <text x="332" y="196" font-size="44" text-anchor="middle" font-family="system-ui, sans-serif">🐼</text>

  <!-- Connection Bridge / Sync Pulse -->
  <path d="M 234 180 Q 256 160 278 180" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="168" r="8" fill="#fbbf24" />

  <!-- Center Checkmark & Sparkle Container -->
  <rect x="144" y="276" width="224" height="132" rx="36" fill="#0f172a" fill-opacity="0.4" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3" />

  <!-- Checkmark -->
  <path d="M 204 344 L 240 378 L 312 308" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkle Stars -->
  <path d="M 334 260 L 338 274 L 352 278 L 338 282 L 334 296 L 330 282 L 316 278 L 330 274 Z" fill="#fbbf24" />
</svg>
